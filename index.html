<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>reM – Dashboard</title>

<style>
body {
  font-family: serif;
  background: #f4f4f4;
  padding: 40px;
  color: #222;
}
.section {
  margin: 20px auto;
  max-width: 800px;
  padding: 20px;
  background: white;
  border-left: 4px solid #444;
}
.title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}
.point {
  font-size: 16px;
  margin: 5px 0;
}
</style>
</head>

<body>

<h1>reM – Dashboard</h1>

<div id="state"></div>
<div id="register"></div>
<div id="booking"></div>

<script type="module">

import { reM_State } from "./reM_State.js";
import { reM_register } from "./reM_Register.js";
import { reM_isBookable } from "./reM_Booking.js";

async function run() {

  // Register laden
  await reM_register();

  // Booking prüfen
  reM_isBookable();

  // Rendern
  document.getElementById("state").innerHTML = `
    <div class="section">
      <div class="title">State</div>
      <div class="point">ID: ${reM_State.id}</div>
      <div class="point">Mode: ${reM_State.mode}</div>
      <div class="point">Registered: ${reM_State.registered}</div>
      <div class="point">Bookable: ${reM_State.bookable}</div>
    </div>
  `;

  document.getElementById("register").innerHTML = `
    <div class="section">
      <div class="title">Register</div>
      <div class="point">CSV geladen: re-zustand-modi-9-4.csv</div>
    </div>
  `;

  document.getElementById("booking").innerHTML = `
    <div class="section">
      <div class="title">Booking</div>
      <div class="point">
        Status: ${reM_State.bookable ? "BUCHBAR" : "NICHT buchbar"}
      </div>
    </div>
  `;
}

run();

</script>

</body>
</html>
